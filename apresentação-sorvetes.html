<!DOCTYPE html>
<html lang="pt-BR" class="pre">
<head>
<meta charset="utf-8">
<title>DeliGeli — Picolés com fruta de verdade</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.higgs.ai" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
:root{--u:1px;--n:1px;--fy:0px}
html,body{height:100%;margin:0;overflow:hidden;background:#C2B0DC;color:#fff;font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased;touch-action:pan-y}
html.pre #stage{opacity:0}
#stage{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;overflow:hidden;display:none}
.frame{position:absolute;width:calc(1440*var(--u));height:calc(900*var(--u));left:calc(50% - 720*var(--u));top:calc(50% - 450*var(--u) + var(--fy))}
.layer{position:absolute;inset:0;will-change:transform}
.layer>*{position:absolute}
.word{left:0;width:100%;text-align:center;white-space:nowrap;line-height:1;font-weight:700;color:#fff}
.shadow{background:radial-gradient(closest-side,rgba(60,40,80,.22),transparent);border-radius:50%;filter:blur(calc(4*var(--u)))}
.bob{position:absolute;inset:0;transform:rotate(var(--r));animation:bob var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes bob{from{transform:translateY(calc(-7*var(--u))) rotate(calc(var(--r) - 3deg))}to{transform:translateY(calc(7*var(--u))) rotate(calc(var(--r) + 3deg))}}

#ui{position:fixed;inset:0;z-index:10;pointer-events:none;text-shadow:0 1px 6px rgba(90,70,40,.18)}
#ui a,#ui button{pointer-events:auto;background:none;border:0;color:#fff;font:inherit;text-decoration:none;cursor:pointer;padding:0}
header{position:absolute;left:calc(50*var(--n));right:calc(50*var(--n));top:calc(26*var(--n));height:calc(50*var(--n));display:flex;align-items:center}
.logo{font:800 calc(51*var(--n))/1 "Baloo 2",Poppins,sans-serif;letter-spacing:-.02em}
.tabs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:calc(88*var(--n));font:500 calc(21*var(--n)) Poppins,sans-serif}
.tabs button{padding:calc(6*var(--n)) 0;font:inherit;white-space:nowrap}
.ul{position:absolute;left:0;top:calc(100% + 2*var(--n));height:2px;width:0;border-radius:2px;background:#fff;transition:transform .6s cubic-bezier(.65,0,.35,1),width .6s cubic-bezier(.65,0,.35,1)}
.ul.nt{transition:none}
.acc{margin-left:auto;display:flex;gap:calc(22*var(--n));font:500 calc(21*var(--n)) Poppins,sans-serif}
.acc span{opacity:.9}
.shop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(36*var(--n));font:600 calc(21*var(--n)) Poppins,sans-serif;letter-spacing:.2em;padding:calc(10*var(--n)) calc(16*var(--n));white-space:nowrap}
.arr{position:absolute;bottom:calc(30*var(--n));width:calc(52*var(--n));height:calc(52*var(--n));display:grid;place-items:center}
.arr svg{width:calc(28*var(--n));height:calc(28*var(--n));filter:drop-shadow(0 1px 6px rgba(90,70,40,.18))}
.prev{left:calc(36*var(--n))}.next{right:calc(36*var(--n))}
.rise{opacity:0;translate:0 14px}
.rise.in{opacity:1;translate:0 0;transition:opacity 1s cubic-bezier(.22,.8,.3,1),translate 1s cubic-bezier(.22,.8,.3,1)}

.m header{left:20px;right:20px;top:16px;height:40px}
.m .logo{font-size:34px}
.m .acc{font-size:15px;gap:10px}
.m .tabs{top:36px;transform:translateX(-50%);gap:22px;font-size:15px}
.m .shop{font-size:15px;bottom:22px}
.m .arr{width:48px;height:48px;bottom:12px}
.m .arr svg{width:24px;height:24px}
.m .prev{left:8px}.m .next{right:8px}

@media (prefers-reduced-motion:reduce){
 .bob{animation:none}
 .rise{opacity:1;translate:none}.rise.in{transition:none}
 .ul{transition:none}
}
</style>
</head>

const sheetUrl=f=>'https://images.higgs.ai/?default=1&output=webp&w=2048&q=85&url='+encodeURIComponent(CF+f);
// Flavours: name, backdrop, sheet file, item boxes [x,y,w,h], bottle [x,y,w], pieces [item,x,y,w,rot,mirror] (last 2 = blurred corners)
const F=[
{n:'Amora',bg:'#C2B0DC',f:'20261117_053958_8803e421-29b1-4c24-8efd-54cae3f479b4.png',
 b:[[233,60,598,917],[1209,272,569,573],[265,1230,579,572],[1192,1192,626,641]],bt:[518,138,372],
 p:[[2,383,178,104,0,0],[3,960,232,118,0,0],[1,295,478,129,-8,0],[1,1247,455,123,15,0],[2,968,590,110,30,0],[1,-15,590,255,0,0],[3,1282,40,200,0,0]]},
{n:'Kiwi',bg:'#B4D58A',f:'20261117_053958_b5695e60-72da-4b5b-bfb7-a091d528af75.png',
 b:[[217,90,610,874],[1204,257,619,601],[250,1197,619,522],[1200,1186,633,650]],bt:[504,135,403],
 p:[[2,376,170,144,-150,1],[3,960,228,152,0,0],[1,303,460,168,0,0],[2,1187,462,148,-25,0],[2,946,606,150,10,1],[1,-10,575,260,0,0],[3,1285,30,200,0,0]]},
{n:'Banana',bg:'#F3DA8A',f:'20261117_053958_6cf14029-4bce-4c9a-b9fc-1c5b185082e3.png',
 b:[[194,76,579,873],[1205,228,596,597],[230,1181,624,648],[1193,1182,646,659]],bt:[512,135,383],
 p:[[1,387,147,123,0,0],[2,970,223,136,-10,1],[3,298,483,132,15,0],[2,1245,462,150,20,0],[3,950,582,130,-12,0],[3,0,585,235,0,0],[1,1280,30,190,0,0]]},
{n:'Morango',bg:'#F2AFC0',f:'20261117_055135_cbfb5a8d-c52b-4358-a6ee-d941c6c42285.png',
 b:[[226,88,594,887],[1190,216,561,653],[257,1168,604,662],[1240,1169,632,686]],bt:[512,135,386],
 p:[[1,372,142,128,0,0],[2,955,225,117,20,0],[3,290,455,140,-10,0],[3,1250,432,135,15,0],[2,962,558,146,-15,0],[1,-10,555,245,0,0],[1,1285,35,200,20,0]]}
];
const SH=[[345,650,170,24],[720,708,320,30],[1318,638,160,22],[1045,760,150,22]];
const FAC=[.40,.30,.15,.55,.75]; // word, shadow, bottle, fruit, corner
const px=v=>`calc(${v}*var(--u))`;
const el=(c,s)=>{const e=document.createElement('div');if(c)e.className=c;if(s)e.style.cssText=s;return e};
const rnd=(a,b)=>a+Math.random()*(b-a);
const root=document.documentElement, stage=document.getElementById('stage');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// background crop of an item box at target width w
function crop(fl,item,x,y,w){
  const [bx,by,bw,bh]=fl.b[item], s=w/bw;
  return `left:${px(x)};top:${px(y)};width:${px(w)};height:${px(bh*s)};background:url("${fl.url}") no-repeat;background-size:${px(2048*s)} ${px(2048*s)};background-position:${px(-bx*s)} ${px(-by*s)}`;
}

// build slides
const slides=F.map((fl,fi)=>{
  fl.url=sheetUrl(fl.f); new Image().src=fl.url;
  const sec=el('slide','background:'+fl.bg), fr=el('frame');
  const L=[0,1,2,3,4].map(()=>el('layer'));
  const word=el('word'); word.textContent=fl.n; L[0].append(word);
  SH.forEach(([cx,cy,w,h])=>L[1].append(el('shadow',`left:${px(cx-w/2)};top:${px(cy-h/2)};width:${px(w)};height:${px(h)}`)));
  L[2].append(el('',`left:${px(545)};top:${px(128)};width:${px(350)};height:${px(580)};background:url(${POP[fi]}) center/contain no-repeat`));
  fl.p.forEach(([it,x,y,w,r,mi],i)=>{
    const corner=i>=5, o=el('',crop(fl,it,x,y,w).replace(/;background.*$/,'')+(mi?';transform:scaleX(-1)':'')+(corner?`;filter:blur(${px(9)})`:''));
    const inner=el('bob',crop(fl,it,x,y,w).replace(/left:.*?;top:.*?;width:.*?;height:.*?;/,'')+`;--r:${r}deg;--d:${rnd(3.2,5).toFixed(2)}s;--dl:-${rnd(0,4).toFixed(2)}s`);
    o.append(inner); L[corner?4:3].append(o);
  });
  fr.append(...L); sec.append(fr); stage.append(sec);
  return {sec,fr,L,word,fl};
});

// canvas ink measurement for the giant word (at 100px)
const ctx=document.createElement('canvas').getContext('2d');
function ink(w){ctx.font='700 100px Poppins';const m=ctx.measureText(w);return m.actualBoundingBoxLeft+m.actualBoundingBoxRight}

let u=1,mobile=false,cur=0,busy=false,last=0;
function layoutWords(){
  const vis=Math.min(1440,innerWidth/u)*.92;
  slides.forEach(s=>{
    const k=ink(s.fl.n); let fs=445,ls=.005;
    const lim=mobile?vis:1330, tgt=mobile?vis:1400;
    if(k*4.45>lim){ls=-.035;fs=Math.min(445,tgt/k*100)}
    const base=403.5+.698*fs/2;
    s.word.style.cssText=`font-size:${px(fs)};letter-spacing:${ls}em;top:${px(base-.85*fs)}`;
  });
}
const tabs=[...document.querySelectorAll('#tabs button')], ul=document.getElementById('ul');
function moveUl(instant){
  const b=tabs[cur];
  if(instant){ul.classList.add('nt')}
  ul.style.width=b.offsetWidth+'px'; ul.style.transform=`translateX(${b.offsetLeft}px)`;
  if(instant){ul.offsetWidth;ul.classList.remove('nt')}
  tabs.forEach((t,i)=>i===cur?t.setAttribute('aria-current','true'):t.removeAttribute('aria-current'));
}
function resize(){
  const w=innerWidth,h=innerHeight;
  mobile=w<=820||h>w; root.classList.toggle('m',mobile);
  u=mobile?Math.min(w/640,(h-200)/620):Math.min(w/1440,h/900);
  root.style.setProperty('--u',u+'px');
  root.style.setProperty('--fy',mobile?'8px':'0px');
  root.style.setProperty('--n',mobile?'1px':Math.min(1.3,Math.max(.5,Math.min(w/1440,h/900)))+'px');
  layoutWords(); moveUl(true);
}

// flavour change
const T=[0,.031,.134,.206,.278,.34,.412,.485,.546,.583,.62,.69,.79,.85,.93,1];
const C=[0,.006,.012,.023,.047,.07,.105,.158,.246,.55,.825,.9,.94,.956,.975,1];
function cover(t){if(t>=1)return 1;let i=0;while(T[i+1]<t)i++;const k=(t-T[i])/(T[i+1]-T[i]);return C[i]+(C[i+1]-C[i])*k*k*(3-2*k)}
const setX=(s,fn)=>s.L.forEach((l,i)=>l.style.transform=fn(i)?`translateX(${fn(i)}px)`:'');
function go(to,dir){
  if(busy||to===cur)return; last=performance.now();
  const A=slides[cur],B=slides[to],from=cur; cur=to; moveUl(false);
  if(reduce){A.sec.style.display='none';B.sec.style.display='block';return}
  busy=true; B.sec.style.display='block';B.sec.style.zIndex=1;A.sec.style.zIndex=2;
  const fw=1440*u,t0=performance.now();
  (function tick(now){
    const t=(now-t0)/970, c=cover(Math.min(t,1));
    A.sec.style.clipPath=dir>0?`inset(0 ${c*100}% 0 0)`:`inset(0 0 0 ${c*100}%)`;
    setX(A,()=>-dir*c*.14*fw);
    const q=Math.min(1,Math.max(0,(t-.5)/.42)), k=1-(1-q)*(1-q);
    setX(B,i=>dir*(1-k)*FAC[i]*fw);
    if(t<1||k<1){requestAnimationFrame(tick);return}
    A.sec.style.display='none';A.sec.style.clipPath='';A.sec.style.zIndex='';A.L.forEach(l=>l.style.transform='');
    setX(B,()=>0);B.sec.style.zIndex=2;B.sec.style.clipPath='';
    busy=false;
  })(t0);
}
const next=()=>go((cur+1)%4,1), prev=()=>go((cur+3)%4,-1);
tabs.forEach((t,i)=>t.onclick=()=>{last=performance.now();if(i!==cur)go(i,i>cur?1:-1)});
document.getElementById('next').onclick=()=>{last=performance.now();next()};
document.getElementById('prev').onclick=()=>{last=performance.now();prev()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){last=performance.now();next()}else if(e.key==='ArrowLeft'){last=performance.now();prev()}});
let sx=0,sy=0;
stage.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){last=performance.now();dx<0?next():prev()}});
setInterval(()=>{if(!document.hidden&&performance.now()-last>6000)next()},2600);
addEventListener('resize',resize);

// opening sequence
let started=false;
function start(){
  if(started)return;started=true;
  slides[0].sec.style.display='block';slides[0].sec.style.zIndex=2;
  resize(); root.classList.remove('pre');
  const fw=1440*u;
  if(!reduce)slides[0].L.forEach((l,i)=>l.animate([{transform:`translateX(${FAC[i]*fw}px)`},{transform:'translateX(0)'}],{duration:900,easing:'cubic-bezier(.22,.8,.3,1)'}));
  document.querySelectorAll('.rise').forEach((e,i)=>{
    const d=[250,330,490,570,650][i]||0;
    e.style.transitionDelay=reduce?'0ms':d+'ms'; requestAnimationFrame(()=>e.classList.add('in'));
  });
}
resize();
Promise.all([document.fonts.load('700 100px Poppins'),document.fonts.load('500 21px Poppins'),document.fonts.load('600 21px Poppins'),document.fonts.load('800 51px "Baloo 2"')]).then(()=>document.fonts.ready).then(start,start);
setTimeout(start,3000);
})();
